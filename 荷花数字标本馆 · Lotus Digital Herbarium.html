<style>
  :root{
    --bg-1:#FBF9F5;
    --bg-2:#FAF8F5;
    --bg-3:#F8F7F6;
    --bg-4:#F2F5F9;
    --ink:#1A1A1A;
    --ink-deep:#111111;
    --ink-soft:#6B6B6B;
    --hairline:rgba(17,17,17,.14);
    --ease:cubic-bezier(0.16,1,0.3,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;}
  body{
    background:var(--bg-1);
    color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    transition:background 1.6s var(--ease);
    cursor:pointer;
  }
  body[data-state="1"]{background:var(--bg-1);}
  body[data-state="2"]{background:var(--bg-2);}
  body[data-state="3"]{background:var(--bg-3);}
  body[data-state="4"]{background:var(--bg-4);}

  .stage{position:relative;width:100%;height:100%;display:flex;flex-direction:column;}

  .masthead{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:28px 48px 0;font-size:10px;letter-spacing:0.18em;
    text-transform:uppercase;color:var(--ink-soft);user-select:none;
  }
  .masthead .mid{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;letter-spacing:0.18em;}

  .body{position:relative;flex:1;display:flex;align-items:stretch;min-height:0;}

  .left{
    position:relative;flex:0 0 auto;width:46%;
    display:flex;flex-direction:column;justify-content:center;
    padding-left:48px;padding-right:20px;z-index:3;pointer-events:none;
  }
  .left .rule{position:absolute;left:48px;top:calc(50% - 120px);width:1px;height:240px;background:var(--ink);opacity:.22;}
  .left .serial{font-size:10px;letter-spacing:0.18em;color:var(--ink-soft);margin-bottom:18px;text-transform:uppercase;}
  .left h1{font-size:72px;line-height:1.02;font-weight:400;letter-spacing:-0.02em;color:var(--ink-deep);white-space:nowrap;}
  .title-line{display:block;position:relative;}
  .title-line .inner{display:inline-block;}
  .title-line.reveal .inner{animation:uncover .9s var(--ease) both;}
  @keyframes uncover{0%{clip-path:inset(0 100% 0 0);}100%{clip-path:inset(0 0 0 0);}}

  .right{
    position:relative;flex:1 1 auto;display:flex;flex-direction:column;
    justify-content:center;padding-left:32px;padding-right:48px;z-index:3;pointer-events:none;
  }
  .right .pager{font-size:13px;letter-spacing:0.18em;color:var(--ink-soft);margin-bottom:14px;}
  .right .pager .cur{color:var(--ink-deep);font-weight:500;}
  .right .subtitle{font-size:15px;letter-spacing:0.28em;text-transform:uppercase;color:var(--ink-deep);margin-bottom:20px;font-weight:500;}
  .right .desc{font-size:13px;line-height:1.9;letter-spacing:0.02em;color:var(--ink-soft);max-width:26ch;}

  .progress{display:flex;gap:10px;padding:0 48px 36px;}
  .progress .seg{flex:1;height:28px;background:var(--hairline);transition:background 1.6s var(--ease);position:relative;}
  .progress .seg.on{background:var(--ink-deep);}
  body[data-state="4"] .progress .seg.on{background:#1d2733;}
  .progress .seg .lbl{position:absolute;top:100%;left:0;margin-top:10px;font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap;}

  .flower-wrap{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;
    z-index:1;pointer-events:none;
  }
  .flower-wrap svg{width:auto;height:80%;max-height:680px;margin-right:4%;}

  .hint{position:absolute;left:48px;bottom:96px;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-soft);opacity:.7;pointer-events:none;}

  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important;animation-duration:.01ms !important;}
  }
  @media (max-width:1100px){
    .left h1{font-size:52px;}
    .right .desc{max-width:20ch;}
  }
</style>

  // {rotG, dayG, moonG, whorl(轮号), i(片内序号), def, phi, base 3D数据}
  var petals = [];       // 每片 {whorl, phi, def}
  var petalNodes = [];   // 对应 DOM

  // 每轮独立开放度 p（弹簧驱动）
  var layers = [];       // 每轮 {p, target, from, to, start, delay, active}
  var FRONT_LAYER = 0;   // 破界瓣跟随轮0

  // 生成渐变 defs
  function addGrad(id, stops){
    var g = document.createElementNS(NS,"linearGradient");
    g.setAttribute("id", id);
    stops.forEach(function(s){
      var st = document.createElementNS(NS,"stop");
      st.setAttribute("offset", s[0]);
      st.setAttribute("stop-color", s[1]);
      if(s[2]!==undefined) st.setAttribute("stop-opacity", s[2]);
      g.appendChild(st);
    });
    document.getElementById("defs").appendChild(g);
    return g;
  }

  function buildPetal(def, whorlIdx, phiDeg, isFront){
    var phia = phiDeg;
    var base = null; // 动态计算

    // 外层定位 g
    var group = document.createElementNS(NS,"g");
    // 内层旋转+缩放 g（绕基部）
    var rotG = document.createElementNS(NS,"g");
    rotG.setAttribute("class","petal-rot");

    // 日色组
    var dayG = document.createElementNS(NS,"g");
    // 月色组
    var moonG = document.createElementNS(NS,"g");
    moonG.setAttribute("opacity","0");

    // 渐变 id
    var c = def.c;
    var tipDay = dayTip(c), tipMoon = moonTip(c);
    var gdBase = "g"+whorlIdx+"_"+phiDeg+"_base";
    var gdDay  = "g"+whorlIdx+"_"+phiDeg+"_day";
    var gdMoon = "g"+whorlIdx+"_"+phiDeg+"_moon";
    var gdVol  = "g"+whorlIdx+"_"+phiDeg+"_vol";

    // 日色底渐变（纵向：基部象牙白→中段→瓣尖粉）
    var midDay = lerp3(IVORY, tipDay, 0.55);
    addGrad(gdDay, [
      ["0%", hex(IVORY)],
      ["55%", hex(midDay)],
      ["100%", hex(tipDay)]
    ]).setAttribute("gradientUnits","objectBoundingBox");
    document.getElementById(gdDay).setAttribute("x1","0");document.getElementById(gdDay).setAttribute("y1","1");
    document.getElementById(gdDay).setAttribute("x2","0");document.getElementById(gdDay).setAttribute("y2","0");

    // 月色底渐变
    var midMoon = lerp3(MOON_BASE, tipMoon, 0.55);
    addGrad(gdMoon, [
      ["0%", hex(MOON_BASE)],
      ["55%", hex(midMoon)],
      ["100%", hex(tipMoon)]
    ]).setAttribute("gradientUnits","objectBoundingBox");
    document.getElementById(gdMoon).setAttribute("x1","0");document.getElementById(gdMoon).setAttribute("y1","1");
    document.getElementById(gdMoon).setAttribute("x2","0");document.getElementById(gdMoon).setAttribute("y2","0");

    // 横向体积渐变（瓣缘暗、中脊亮）
    addGrad(gdVol, [
      ["0%", css([140,110,120],0.30)],
      ["50%", css([255,255,255],0.34)],
      ["100%", css([140,110,120],0.30)]
    ]).setAttribute("gradientUnits","objectBoundingBox");
    document.getElementById(gdVol).setAttribute("x1","0");document.getElementById(gdVol).setAttribute("y1","0");
    document.getElementById(gdVol).setAttribute("x2","1");document.getElementById(gdVol).setAttribute("y2","0");

    var d = petalPathD();

    // 层1 日色底
    var p1 = document.createElementNS(NS,"path");
    p1.setAttribute("d", d); p1.setAttribute("fill","url(#"+gdDay+")");
    p1.setAttribute("stroke","rgba(0,0,0,0.04)"); p1.setAttribute("stroke-width","0.6");
    dayG.appendChild(p1);
    // 层2 横向体积
    var p2 = document.createElementNS(NS,"path");
    p2.setAttribute("d", d); p2.setAttribute("fill","url(#"+gdVol+")");
    dayG.appendChild(p2);
    // 层3 基部暖影（底部渐淡暖色）
    var gdWarm = "g"+whorlIdx+"_"+phiDeg+"_warm";
    addGrad(gdWarm, [
      ["0%", css([196,120,104],0.28)],
      ["40%", css([196,120,104],0.0)]
    ]).setAttribute("gradientUnits","objectBoundingBox");
    document.getElementById(gdWarm).setAttribute("x1","0");document.getElementById(gdWarm).setAttribute("y1","1");
    document.getElementById(gdWarm).setAttribute("x2","0");document.getElementById(gdWarm).setAttribute("y2","0");
    var p3 = document.createElementNS(NS,"path");
    p3.setAttribute("d", d); p3.setAttribute("fill","url(#"+gdWarm+")");
    dayG.appendChild(p3);
    // 层4 白脊线 + 侧脉
    var ridge = document.createElementNS(NS,"path");
    ridge.setAttribute("d","M 0 0 C 0 -70, 0 -160, 0 -230");
    ridge.setAttribute("stroke","rgba(255,255,255,0.55)"); ridge.setAttribute("stroke-width","2.2");
    ridge.setAttribute("fill","none"); ridge.setAttribute("stroke-linecap","round");
    dayG.appendChild(ridge);
    for(var k=0;k<2;k++){
      var sign = (k===0?-1:1);
      var vein = document.createElementNS(NS,"path");
      vein.setAttribute("d","M "+sign*10+" -18 C "+sign*30+" -90, "+sign*38+" -150, "+sign*26+" -210");
      vein.setAttribute("stroke","rgba(255,255,255,0.20)"); vein.setAttribute("stroke-width","1.4");
      vein.setAttribute("fill","none"); vein.setAttribute("stroke-linecap","round");
      dayG.appendChild(vein);
    }

    // 月色组：底 + 银边
    var m1 = document.createElementNS(NS,"path");
    m1.setAttribute("d", d); m1.setAttribute("fill","url(#"+gdMoon+")");
    m1.setAttribute("stroke","rgba(220,235,255,0.85)"); m1.setAttribute("stroke-width","1.6");
    moonG.appendChild(m1);
    var m2 = document.createElementNS(NS,"path");
    m2.setAttribute("d", d); m2.setAttribute("fill","url(#"+gdVol+")");
    moonG.appendChild(m2);

    rotG.appendChild(dayG);
    rotG.appendChild(moonG);
    group.appendChild(rotG);
    document.getElementById("petals").appendChild(group);

    return {group:group, rotG:rotG, dayG:dayG, moonG:moonG,
            whorl:whorlIdx, def:def, phi:phia, isFront:isFront};
  }

  // ── 生成全部花瓣 ──────────────────────────
  function buildAll(){
    var i,w,j;
    for(w=0; w<WHORLS.length; w++){
      var def = WHORLS[w];
      for(j=0; j<def.n; j++){
        var phi = 90 + 360*j/def.n;   // 方位角（保证左右对称）
        var node = buildPetal(def, w, phi, false);
        petals.push({whorl:w, phi:phi, def:def});
        petalNodes.push(node);
      }
    }
    // 前排破界瓣 3 片
    for(j=0; j<FRONT.n; j++){
      var fphi = 90 + 360*j/FRONT.n;
      var fnode = buildPetal(FRONT, 0, fphi, true);
      petals.push({whorl:0, phi:fphi, def:FRONT});
      petalNodes.push(fnode);
    }
    // 初始化每轮弹簧状态
    for(w=0; w<WHORLS.length; w++){
      layers.push({p:0, target:0, from:0, to:0, start:0, delay:0, active:false});
    }
  }

  // ── 莲蓬 + 花萼 + 花蕊 ─────────────────────
  function buildReceptacle(){
    var rx = 31, ry = 31*Math.cos(E);  // 顶面半径 31，俯视压缩
    var cx = CENTER.x, cy = CENTER.y - 26; // 莲蓬顶面中心（略高于花心）
    var H = 66;                          // 莲蓬高

    // 花萼（2片，莲蓬底部）
    var sep = document.getElementById("sepals");
    var sL = document.createElementNS(NS,"path");
    sL.setAttribute("d","M "+cx+" "+(cy+10)+" C "+(cx-40)+" "+(cy+20)+", "+(cx-52)+" "+(cy+52)+", "+(cx-38)+" "+(cy+78)+" C "+(cx-20)+" "+(cy+60)+", "+(cx-8)+" "+(cy+30)+", "+cx+" "+(cy+12)+" Z");
    sL.setAttribute("fill","#7FA060");
    sL.setAttribute("class","sepal"); sL.setAttribute("id","sepalL");
    var sR = document.createElementNS(NS,"path");
    sR.setAttribute("d","M "+cx+" "+(cy+10)+" C "+(cx+40)+" "+(cy+20)+", "+(cx+52)+" "+(cy+52)+", "+(cx+38)+" "+(cy+78)+" C "+(cx+20)+" "+(cy+60)+", "+(cx+8)+" "+(cy+30)+", "+cx+" "+(cy+12)+" Z");
    sR.setAttribute("fill","#6F9456");
    sR.setAttribute("class","sepal"); sR.setAttribute("id","sepalR");
    sep.appendChild(sL); sep.appendChild(sR);

    // 莲蓬主体（柱体）：侧面 + 顶面
    var rec = document.getElementById("receptacle");
    var body = document.createElementNS(NS,"path");
    // 侧面：从顶面椭圆下缘到花心
    body.setAttribute("d","M "+(cx-rx)+" "+cy+" L "+(cx-rx)+" "+(cy+H)+" A "+rx+" "+ry+" 0 0 0 "+(cx+rx)+" "+(cy+H)+" L "+(cx+rx)+" "+cy+" Z");
    body.setAttribute("fill","#8FA84F");
    rec.appendChild(body);
    var top = document.createElementNS(NS,"ellipse");
    top.setAttribute("cx",cx); top.setAttribute("cy",cy);
    top.setAttribute("rx",rx); top.setAttribute("ry",ry);
    top.setAttribute("fill","#A9C05C");
    rec.appendChild(top);
    // 顶面莲孔
    var dots = document.createElementNS(NS,"g");
    dots.setAttribute("fill","#6E8A3C");
    var holes=[[0,-8],[12,4],[-12,4],[0,10],[-8,-2],[8,-2],[0,0],[16,-4],[-16,-4]];
    holes.forEach(function(h){
      var cc=document.createElementNS(NS,"circle");
      cc.setAttribute("cx",cx+h[0]); cc.setAttribute("cy",cy+h[1]); cc.setAttribute("r",2.8);
      dots.appendChild(cc);
    });
    rec.appendChild(dots);
    // 莲蓬中心点
    var ctr=document.createElementNS(NS,"circle");
    ctr.setAttribute("cx",cx);ctr.setAttribute("cy",cy);ctr.setAttribute("r",3.2);ctr.setAttribute("fill","#5E7A30");
    rec.appendChild(ctr);

    // 花蕊 48 根，3D 外倾投影，后半在莲蓬后、前半在莲蓬前
    var back = document.getElementById("stamensBack");
    var front = document.getElementById("stamensFront");
    var NR = 48;
    for(var i=0;i<NR;i++){
      var ph = 360*i/NR * Math.PI/180;
      // 基部在莲蓬顶面边缘（3D）
      var bxp = cx + (rx+2)*Math.cos(ph);
      var bzs = (rx+2)*Math.sin(ph); // 3D 深度/前后
      var byp = cy - bzs*Math.sin(E);
      // 尖端：向外倾斜伸出（3D 外倾，伸出更长、更上翘）
      var tipR = rx + 34;
      var txx = cx + tipR*Math.cos(ph);
      var tzz = tipR*Math.sin(ph);
      var tyy = cy - 16 - tzz*Math.sin(E);
      var st = document.createElementNS(NS,"g");
      var ln = document.createElementNS(NS,"line");
      ln.setAttribute("x1",bxp); ln.setAttribute("y1",byp);
      ln.setAttribute("x2",txx); ln.setAttribute("y2",tyy);
      ln.setAttribute("stroke","#E9B84B"); ln.setAttribute("stroke-width","2.6");
      var dt = document.createElementNS(NS,"circle");
      dt.setAttribute("cx",txx); dt.setAttribute("cy",tyy); dt.setAttribute("r","3.8");
      dt.setAttribute("fill","#EBB64E");
      st.appendChild(ln); st.appendChild(dt);
      st.setAttribute("class","stamen");
      // 后半（sin(ph)>0 即屏幕下方/前方？）
      // 观察者仰视：sin(ph)>0 为屏幕下方=前方(近)，应画在莲蓬之后(=front)
      if(Math.sin(ph) > 0){ front.appendChild(st); } else { back.appendChild(st); }
    }
  }

  // ── 每帧渲染（重算 rot，禁止线性插值）──────
  function renderFrame(){
    var i;
    for(i=0;i<petals.length;i++){
      var pet = petals[i];
      var node = petalNodes[i];
      var w = pet.whorl;
      var p = layers[w].p;   // 该轮开放度
      var def = pet.def;
      // 3D 倾角 T
      var T = def.tb + (def.to - def.tb) * p;
      var pr = project(pet.phi, T);
      var rotDeg = pr.rot * 180/Math.PI;
      // 基部半径
      var R = def.rb + (def.r - def.rb) * p;
      var pha = pet.phi * Math.PI/180;
      // 基部屏幕位置（3D 俯视投影）
      var bx = CENTER.x + R * Math.cos(pha);
      var by = CENTER.y - R * Math.sin(pha) * Math.sin(E);
      // 宽度系数：侧向瓣收窄，最小 0.56-0.24p
      var wc = (0.56 - 0.24*p) + (1 - (0.56 - 0.24*p)) * Math.abs(Math.cos(pha));
      var sx = def.s * wc;
      var sy = def.s * pr.len;
      node.group.setAttribute("transform","translate("+bx.toFixed(2)+" "+by.toFixed(2)+")");
      node.rotG.setAttribute("transform","rotate("+rotDeg.toFixed(3)+") scale("+sx.toFixed(4)+" "+sy.toFixed(4)+")");
    }
  }

  // ── 弹簧动画 ─────────────────────────────
  var DURATION = 1650;   // ms
  var STEP = 90;         // 逐层错峰 ms
  function spring(sec){   // sec 为秒
    return 1 - Math.exp(-6.2*sec) * Math.cos(6.4*sec);
  }

  var raf = null;
  function startLayer(w, to){
    var L = layers[w];
    L.from = L.p;
    L.to = to;
    L.active = true;
    L.start = performance.now();
    L.delay = 0;
  }
  function startAll(target){
    // 绽放(0→1)外层先动；收拢(1→0)内层先收
    var w;
    for(w=0; w<WHORLS.length; w++){
      var L = layers[w];
      L.from = L.p;
      L.to = target;
      L.active = true;
      L.start = performance.now();
      L.delay = (target > L.from) ? w*STEP : (WHORLS.length-1-w)*STEP;
    }
    if(!raf) raf = requestAnimationFrame(tick);
  }

  function tick(now){
    var any = false;
    var w;
    for(w=0; w<WHORLS.length; w++){
      var L = layers[w];
      if(!L.active) continue;
      var t = (now - L.start - L.delay)/DURATION;
      if(t < 0){ t = 0; any = true; }
      else if(t > 1.65/DURATION*1.0 && t >= 1){ t = 1; }
      if(t >= 1){ L.p = L.to; L.active = false; }
      else if(t >= 0){
        var sec = t * (DURATION/1000);
        var sp = spring(sec);
        L.p = L.from + (L.to - L.from) * sp;
        any = true;
      } else {
        any = true;
      }
    }
    renderFrame();
    renderMoon();
    renderCore();
    if(any){ raf = requestAnimationFrame(tick); }
    else { raf = null; }
  }

  // ── 月色交叉淡化（逐层 70ms）───────────────
  var moonTarget = 0;      // 0=日色, 1=月色
  var moonFrom = 0;
  var moonStart = 0;
  var moonActive = false;
  function setMoon(on){
    moonFrom = moonTarget;
    moonTarget = on ? 1 : 0;
    moonStart = performance.now();
    moonActive = true;
    if(!raf) raf = requestAnimationFrame(tick);
  }
  function renderMoon(){
    if(!moonActive) return;
    var now = performance.now();
    var t = (now - moonStart)/1200;
    if(t >= 1){ t = 1; moonActive = false; }
    var k = moonFrom + (moonTarget - moonFrom) * t;
    var i;
    for(i=0;i<petalNodes.length;i++){
      var node = petalNodes[i];
      var w = node.whorl;
      var d = w*70; // 逐层延迟 70ms
      var kk = Math.max(0, Math.min(1, (t*1200 - d)/ (1200-d) ));
      var a = moonFrom + (moonTarget - moonFrom) * kk;
      node.moonG.setAttribute("opacity", a.toFixed(3));
      node.dayG.setAttribute("opacity", (1-a).toFixed(3));
    }
  }

  // ── 花心/花蕊/花萼随开放度显隐 ─────────────
  function renderCore(){
    var pOuter = layers[0].p;
    var coreOp = Math.max(0, (pOuter - 0.5)/0.5);  // p>0.5 后出现
    document.getElementById("receptacle").setAttribute("opacity", coreOp.toFixed(3));
    document.getElementById("stamensBack").setAttribute("opacity", coreOp.toFixed(3));
    document.getElementById("stamensFront").setAttribute("opacity", coreOp.toFixed(3));
    // 花萼微张
    var so = (1-pOuter)*8 + 6;
    var sL=document.getElementById("sepalL"), sR=document.getElementById("sepalR");
    if(sL) sL.setAttribute("transform","rotate("+(-so)+" "+CENTER.x+" "+(CENTER.y-16)+")");
    if(sR) sR.setAttribute("transform","rotate("+so+" "+CENTER.x+" "+(CENTER.y-16)+")");
  }

  // ── 文字 ────────────────────────────────
  var TITLES = [
    {l1:"Before the bloom.", l2:"", serial:"Phase 01 · Potential", sub:"Potential", desc:"A sealed bud holds its breath, every petal folded inward, waiting for light."},
    {l1:"The first opening.", l2:"", serial:"Phase 02 · Awakening", sub:"Awakening", desc:"The outer two ranks ease open, no more than twelve degrees, a first reluctant breath."},
    {l1:"In full bloom.", l2:"", serial:"Phase 03 · In Bloom", sub:"In Bloom", desc:"Every petal unfolds. Golden stamens ring a pale green seedpod at the heart."},
    {l1:"Blue, in full.", l2:"", serial:"Phase 04 · Moonlit", sub:"Moonlit", desc:"Beneath the moon the whole bloom turns indigo, each petal edged in silver light."},
  ];

  function setText(s){
    var t=TITLES[s-1];
    document.getElementById("serial").textContent=t.serial;
    document.getElementById("sub").textContent=t.sub;
    document.getElementById("desc").textContent=t.desc;
    document.getElementById("pcur").textContent=("0"+s).slice(-2);
    function reveal(lineEl, inner, text){
      inner.textContent=text;
      lineEl.classList.remove("reveal");
      void lineEl.offsetWidth;
      lineEl.classList.add("reveal");
    }
    reveal(document.getElementById("tl1"),document.getElementById("t1"),t.l1);
    reveal(document.getElementById("tl2"),document.getElementById("t2"),t.l2);
  }
  function setProgress(s){
    for(var i=1;i<=4;i++){ document.getElementById("seg"+i).classList.toggle("on", i<=s); }
  }

  // ── 状态映射 ─────────────────────────────
  // 01 花苞 p=0；02 初绽(外层两轮 p=0.12)；03 盛放 p=1；04 月色 p=1
  var STATE_TARGET = {
    1:{all:0, partial:null},
    2:{all:0, partial:0.12},
    3:{all:1, partial:null},
    4:{all:1, partial:null},
  };
  var S = 1;

  function applyState(s, instant){
    document.body.setAttribute("data-state", s);
    setText(s);
    setProgress(s);
    var st = STATE_TARGET[s];
    var w;
    if(instant){
      // 直达：直接设最终态，无动画
      for(w=0; w<WHORLS.length; w++){
        var tgt = (st.partial!==null) ? (w<=1?st.partial:st.all) : st.all;
        layers[w].p = tgt; layers[w].from=tgt; layers[w].to=tgt; layers[w].active=false;
      }
      renderFrame(); renderCore();
      setMoonInstant(s===4);
      return;
    }
    if(st.partial !== null){
      // 02 态：仅外层两轮（0,1）到 partial，其余到 all
      for(w=0; w<WHORLS.length; w++){
        var tgt2 = (w<=1) ? st.partial : st.all;
        var L = layers[w];
        if(L.p !== tgt2){ L.from=L.p; L.to=tgt2; L.active=true; L.start=performance.now();
          L.delay = (tgt2>L.from)? w*STEP : (WHORLS.length-1-w)*STEP; }
      }
    } else {
      startAll(st.all);
    }
    setMoon(s===4);
  }

  function setMoonInstant(on){
    var a = on ? 1 : 0;
    var i;
    for(i=0;i<petalNodes.length;i++){
      petalNodes[i].moonG.setAttribute("opacity", String(a));
      petalNodes[i].dayG.setAttribute("opacity", String(1-a));
    }
    moonTarget = a; moonFrom = a; moonActive = false;
  }

  function next(){
    S = (S%4)+1;
    applyState(S, false);
  }

  // ── 初始化 ───────────────────────────────
  function setup(){
    buildAll();
    buildReceptacle();
    // 初始：所有层 p=0，无动画直接渲染
    renderFrame();
    renderCore();
    // 读取 URL ?s=
    var params = new URLSearchParams(window.location.search);
    var s = parseInt(params.get("s"),10);
    if(s>=1 && s<=4) S = s;
    // 直达：直接渲染目标态（无动画）
    applyState(S, true);

    document.addEventListener("click", next);
    document.addEventListener("keydown", function(e){
      if(e.key===" "||e.key==="ArrowRight"||e.key==="Enter"){ e.preventDefault(); next(); }
    });
  }

  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded", setup); }
  else { setup(); }
})();
</script>
